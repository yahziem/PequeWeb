<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Galería 😻</title>

    <link
        rel="stylesheet"
        href="style/styles.css"
    >

</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">

            <img
                src="logo.ico"
                alt="Logo"
            >

        </div>

        <!-- NAV -->
        <nav>

            <button
                class="boton-elegante"
                onclick="location.href='inicio.html';"
            >
                Inicio
            </button>

            <button
                class="boton-elegante"
                onclick="location.href='galeria.html';"
            >
                Galería
            </button>

            <button
                class="boton-elegante"
                onclick="location.href='Canciones.html';"
            >
                Canciones
            </button>

            <button
                class="boton-elegante"
                onclick="location.href='Notas.html';"
            >
                Notas
            </button>

        </nav>

    </header>

    <!-- SUBIR IMÁGENES -->
    <div class="upload-section">

        <label
            for="imageUpload"
            class="upload-button"
        >
            📸 Subir Fotos
        </label>

        <input
            type="file"
            id="imageUpload"
            accept="image/*"
            multiple
            hidden
        >

    </div>

    <!-- GALERÍA -->
    <div
        class="gallery-container"
        id="galleryContainer"
    ></div>

    <!-- SCRIPT -->
    <script
        type="module"
        src="Gl/JS/script.js"
    ></script>

</body>

</html>
