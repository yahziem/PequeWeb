<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <meta name="description" content="Bienvenida personalizada para acceder a la página web de Peque.">
    <link rel="icon" href="logo.ico" type="image/x-icon">
    <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
    <style>
        :root {
            color-scheme: dark;
            --blue: #1e70bd;
            --blue-dark: #0f5ea3;
        }

        body, html {
            background: rgb(0, 0, 0);
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .form-container {
            background: #111;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(30, 112, 189, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 280px;
            animation: popIn 0.7s cubic-bezier(.68, -0.55, .27, 1.55);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .form-container label {
            color: var(--blue);
            font-size: 1.1em;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .form-container input[type="date"] {
            padding: 10px 16px;
            border: 1.5px solid var(--blue);
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(30, 112, 189, 0.07);
        }

        .form-container input[type="date"]:focus {
            border-color: var(--blue-dark);
        }

        .form-container button {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 28px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-container button:hover {
            background: var(--blue-dark);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .secondary-button {
            background: transparent;
            border: 1px solid var(--blue);
            color: var(--blue);
        }

        .secondary-button:hover {
            background: rgba(30, 112, 189, 0.15);
        }

        .form-container .hint {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 10px;
            font-style: italic;
            letter-spacing: 0.2px;
        }

        .form-container .error {
            color: #ff4d4d;
            margin-top: 14px;
            font-size: 0.95em;
            min-height: 1.2em;
            text-align: center;
        }

        .shake {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-8px);
            }

            80% {
                transform: translateX(8px);
            }

            100% {
                transform: translateX(0);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<video id="videoInicio" autoplay muted playsinline>
    <source src="1.mp4" type="video/mp4">
    Tu navegador no soporta el elemento de video.
</video>

<div id="passwordOverlay" class="overlay" style="display:none;">
    <form class="form-container" id="passwordForm" autocomplete="off">
        <label for="fecha">Introduce la Contraseña</label>
        <div class="hint" id="hintMsg">Pista: es el día de tu cumpleaños</div>
        <input type="date" id="fecha" name="fecha" required aria-describedby="hintMsg errorMsg">
        <div class="form-actions">
            <button type="submit">Entrar</button>
            <button type="button" class="secondary-button" id="skipIntro">Saltar intro</button>
        </div>
        <div class="error" id="errorMsg" role="status" aria-live="polite"></div>
    </form>
</div>

<script>
   
    const FECHA_CORRECTA = "2008-03-17"; 
    const overlay = document.getElementById('passwordOverlay');
    const videoInicio = document.getElementById('videoInicio');
    const fechaInput = document.getElementById('fecha');
    const errorMsg = document.getElementById('errorMsg');

    const mostrarFormulario = () => {
        videoInicio.style.display = 'none';
        overlay.style.display = 'flex';
        document.body.style.overflow = 'auto';
        fechaInput.focus();
    };

    videoInicio.addEventListener('ended', mostrarFormulario);
    videoInicio.addEventListener('error', mostrarFormulario);

    document.getElementById('skipIntro').addEventListener('click', mostrarFormulario);

    document.getElementById('passwordForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const fecha = fechaInput.value;
        if (fecha === FECHA_CORRECTA) {
            window.location.href = 'inicio.html';
        } else {
            errorMsg.textContent = "Fecha incorrecta. Intenta de nuevo.";
            fechaInput.classList.add('shake');
            setTimeout(() => fechaInput.classList.remove('shake'), 400);
        }
    });

    fechaInput.addEventListener('input', () => {
        errorMsg.textContent = "";
    });
    //By return 0,S.A. de C.V.
</script>
</body>
</html>
